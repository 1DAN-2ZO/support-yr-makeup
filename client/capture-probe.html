<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>1-2 촬영 실측 프로브</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #eee; font: 14px/1.4 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .stage { position: relative; width: 100vw; aspect-ratio: 9 / 16; max-height: 68vh; background: #000; overflow: hidden; margin: 0 auto; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
  .gate { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px; background: rgba(0,0,0,.55); font-size: 18px; font-weight: 700; }
  .gate.ready { background: rgba(42,140,133,.85); }
  .shot { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(0,0,0,.55); font-size: 12px; white-space: pre-wrap; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: .8; pointer-events: none; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
  .overlay[hidden] { display: none; }
  .overlay canvas { max-width: 100%; max-height: 60%; border-radius: 8px; border: 2px solid #2a8c85; }
  .overlay h3 { margin: 0; font-size: 18px; }
  .overlay p { margin: 0; font-size: 14px; color: #ccc; }
  .bar { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: #2a8c85; color: #fff; }
  button.alt { background: #555; }
  button:disabled { opacity: .4; }
  .thumbs { display: flex; gap: 6px; padding: 0 12px; }
  .thumb { flex: 1; text-align: center; font-size: 11px; }
  .thumb canvas { width: 100%; background: #222; border-radius: 6px; border: 2px solid #333; }
  .thumb.done canvas { border-color: #2a8c85; }
  pre { margin: 8px 12px; padding: 8px; background: #222; border-radius: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div class="stage">
  <video id="v" autoplay playsinline muted></video>
  <div class="gate" id="gate">시작을 누르세요</div>
  <div class="shot" id="live"></div>
  <div class="flash" id="flash" hidden></div>
  <div class="overlay" id="consent" hidden>
    <h3>서버 처리 동의</h3>
    <p>맨얼굴 사진 3장(정면·좌·우)이 서버로 전송돼 처리된 뒤 즉시 삭제됩니다. 이 실측에서는 사진이 폰 밖으로 나가지 않고 숫자만 PC 로 보냅니다.</p>
    <div class="bar"><button id="agree">동의하고 시작</button><button id="deny" class="alt">거부</button></div>
  </div>
  <div class="overlay" id="confirm" hidden>
    <h3 id="confirmTitle">이 사진으로 할까요?</h3>
    <canvas id="confirmCv"></canvas>
    <p id="confirmInfo"></p>
    <div class="bar"><button id="ok">다음</button><button id="redo" class="alt">다시 찍기</button></div>
  </div>
</div>
<div class="bar">
  <button id="start">시작 (전면 카메라)</button>
  <button id="retake" class="alt" disabled>마지막 장 다시</button>
  <button id="finish" class="alt" disabled>끝 → PC 로 보내기</button>
</div>
<div class="thumbs" id="thumbs"></div>
<pre id="out">준비 중…</pre>
<script type="module" src="/src/screens/capture-probe.ts"></script>
</body>
</html>
