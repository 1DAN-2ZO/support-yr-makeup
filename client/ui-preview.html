<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>화면 미리보기 — 당화응</title>
    <!-- [dev 전용] 앱 화면을 가짜 데이터로 폰 크기에 띄운다. 사람 사진은 쓰지 않는다(합성 얼굴·단색 자리표시). -->
    <style>
      body.preview { margin: 0; padding: 16px; background: #e9e5de; font: 13px system-ui, "Malgun Gothic", sans-serif; }
      .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
      .pick button { padding: 6px 12px; border-radius: 16px; border: 1px solid #cfc9bf; background: #fff; cursor: pointer; }
      .pick button.on { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
      .frame { box-sizing: content-box; width: 412px; height: 892px; border: 10px solid #1f1f1f; border-radius: 40px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.2); position: relative; }
      .frame #app { width: 100%; height: 100%; min-height: 0; overflow-y: auto; }
      .frame.land { width: 892px; height: 412px; }
      /* 틀 안의 100dvh 는 브라우저 창 높이라서, 가로 틀(412)에서는 화면 높이를 틀 높이로 대신한다 */
      .frame.land #root .guide { min-height: 412px; }
      .frame.land #root .result { min-height: 378px; }
      .pick .rot { margin-right: 12px; }
    </style>
  </head>
  <body class="preview">
    <div class="pick" id="pick"></div>
    <div class="frame" id="frame"><div id="app"><div id="root" class="screen"></div></div></div>
    <script type="module" src="/src/screens/ui-preview.ts"></script>
  </body>
</html>
