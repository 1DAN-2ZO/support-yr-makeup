<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>1-3 카메라 잠금이 실제로 유지되나</title>
<style>
  body { font: 15px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; margin: 14px; color: #2b2723; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: #2a8c85; color: #fff; margin: 4px 4px 4px 0; }
  button.alt { background: #666; }
  video { width: 100%; max-width: 320px; background: #000; border-radius: 8px; transform: scaleX(-1); }
  pre { background: #f4f1ee; padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  .big { font-size: 20px; font-weight: 700; min-height: 1.5em; }
</style>
</head>
<body>
<h2>1-3 잠금 유지 확인</h2>
<p>1) <b>시작</b> → 2) <b>잠금 없이 10초</b>: 폰을 밝은 쪽·어두운 쪽으로 천천히 돌린다 → 3) <b>잠금 켜고 10초</b>: 같은 동작 → 4) <b>PC 로 보내기</b>.</p>
<video id="v" autoplay playsinline muted></video>
<div class="big" id="live">—</div>
<div>
  <button id="start">시작</button>
  <button id="runOff" disabled>잠금 없이 10초</button>
  <button id="runOn" disabled>잠금 켜고 10초</button>
  <button id="send" class="alt" disabled>PC 로 보내기</button>
</div>
<pre id="out">시작을 누르세요</pre>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const v = $("v"), out = $("out"), live = $("live");
  const S = { track: null, caps: null, runs: [] };
  const cv = document.createElement("canvas"); const ctx = cv.getContext("2d", { willReadFrequently: true });
  function rgbToL(r, g, b) { const f = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }; const y = 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); return y > 0.008856 ? 116 * Math.cbrt(y) - 16 : 903.3 * y; }
  // 프레임 가운데 40% 상자 평균 L*, R/G·B/G 비 (색온도 대용)
  function sample() {
    const w = 64, h = 64; cv.width = w; cv.height = h;
    ctx.drawImage(v, v.videoWidth * 0.3, v.videoHeight * 0.3, v.videoWidth * 0.4, v.videoHeight * 0.4, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data; let R = 0, G = 0, B = 0; const n = w * h;
    for (let i = 0; i < n; i++) { R += d[i * 4]; G += d[i * 4 + 1]; B += d[i * 4 + 2]; }
    R /= n; G /= n; B /= n;
    return { L: +rgbToL(R, G, B).toFixed(1), rg: +(R / G).toFixed(3), bg: +(B / G).toFixed(3) };
  }
  const pick = (o, keys) => Object.fromEntries(keys.filter((k) => k in o).map((k) => [k, o[k]]));
  const KEYS = ["whiteBalanceMode", "exposureMode", "focusMode", "exposureTime", "exposureCompensation", "iso", "colorTemperature", "focusDistance", "brightness", "torch", "zoom", "width", "height", "frameRate"];
  async function setModes(mode) {
    const r = {};
    for (const k of ["whiteBalanceMode", "exposureMode", "focusMode"]) {
      const modes = S.caps ? S.caps[k] : undefined;
      if (!Array.isArray(modes) || !modes.includes(mode)) { r[k] = "unsupported"; continue; }
      try { await S.track.applyConstraints({ advanced: [{ [k]: mode }] }); r[k] = "ok"; } catch (e) { r[k] = "failed:" + e.name; }
    }
    return r;
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function run(label, mode) {
    const applied = await setModes(mode);
    await sleep(800);
    const settingsAfter = S.track.getSettings ? pick(S.track.getSettings(), KEYS) : {};
    const samples = []; const t0 = performance.now();
    while (performance.now() - t0 < 10000) {
      const s = sample(); const st = S.track.getSettings ? pick(S.track.getSettings(), ["exposureTime", "iso", "colorTemperature", "exposureCompensation"]) : {};
      const row = { t: +((performance.now() - t0) / 1000).toFixed(1), ...s, ...st };
      samples.push(row);
      live.textContent = label + " " + row.t + "s · L* " + s.L + " · R/G " + s.rg + " · B/G " + s.bg;
      await sleep(250);
    }
    const range = (a) => +(Math.max(...a) - Math.min(...a)).toFixed(3);
    const uniq = (k) => new Set(samples.map((s) => s[k]).filter((x) => x != null)).size;
    const summary = { label, mode, applied, settingsAfter, n: samples.length,
      rangeL: range(samples.map((s) => s.L)), rangeRG: range(samples.map((s) => s.rg)), rangeBG: range(samples.map((s) => s.bg)),
      exposureTimeValues: uniq("exposureTime"), isoValues: uniq("iso"), colorTempValues: uniq("colorTemperature"), samples };
    S.runs.push(summary);
    out.textContent = S.runs.map((r) => r.label + ": 적용 " + JSON.stringify(r.applied) + "\n  설정 " + JSON.stringify(r.settingsAfter) + "\n  L* 폭 " + r.rangeL + " · R/G 폭 " + r.rangeRG + " · B/G 폭 " + r.rangeBG + " · 노출시간 값 종류 " + r.exposureTimeValues + " · ISO 종류 " + r.isoValues + " · 색온도 종류 " + r.colorTempValues).join("\n\n");
    live.textContent = label + " 끝";
  }
  $("start").onclick = async () => {
    $("start").disabled = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      v.srcObject = stream; await v.play();
      S.track = stream.getVideoTracks()[0];
      S.caps = S.track.getCapabilities ? S.track.getCapabilities() : null;
      out.textContent = "getCapabilities: " + (S.caps ? "O" : "X (이 브라우저는 잠금 불가)") + "\n" + JSON.stringify(S.caps ? pick(S.caps, KEYS) : {}, null, 1) + "\n\ngetSettings: " + JSON.stringify(S.track.getSettings ? pick(S.track.getSettings(), KEYS) : {}, null, 1);
      $("runOff").disabled = false; $("runOn").disabled = false; $("send").disabled = false;
    } catch (e) { out.textContent = "카메라 실패: " + e; }
  };
  $("runOff").onclick = () => { $("runOff").disabled = true; run("잠금 없음(continuous)", "continuous").catch((e) => { out.textContent += "\n실패 " + e; }); };
  $("runOn").onclick = () => { $("runOn").disabled = true; run("잠금(manual)", "manual").catch((e) => { out.textContent += "\n실패 " + e; }); };
  $("send").onclick = async () => {
    $("send").disabled = true;
    const body = { kind: "lock-hold", ua: navigator.userAgent, startedAt: new Date().toISOString(), frame: [v.videoWidth, v.videoHeight], caps: S.caps ? pick(S.caps, KEYS) : null, capsSupported: !!S.caps, runs: S.runs };
    try { const r = await fetch("/__probe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); out.textContent = (r.ok ? "PC 저장됨: " + await r.text() : "저장 실패 " + r.status) + "\n\n" + out.textContent; }
    catch (e) { out.textContent = "저장 실패 " + e + "\n\n" + out.textContent; }
    if (S.track) S.track.stop();
  };
</script>
</body>
</html>
