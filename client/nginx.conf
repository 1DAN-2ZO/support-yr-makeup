# 프론트 컨테이너(nginx) 설정.
#
# 바깥에서 백엔드에 닿을 길이 없어서 넣는다 — Cloudflare 가 80 포트만 내보내고,
# 기본 설정 nginx 는 정적 파일만 주기 때문에 /events · /health 가 전부 404 였다.
# 80 포트는 이미 열려 있으므로 터널·DNS·방화벽은 건드리지 않는다.
#
# 백엔드 경로를 **그 이름 그대로** 넘긴다 (PR #317 이 정한 POST /events 규격).
# 백엔드에 경로가 새로 생기면 아래 목록에 한 줄 더 적어야 한다. (/events · /transfer · /health)

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # 사용 기록(POST /events)이 64KB 묶음으로 온다. 기본 1MB 면 넉넉하지만 명시해 둔다
    client_max_body_size 2m;

    # 사용 기록 받기 (PR #317)
    location = /events {
        # 도커 내부 DNS 로 **요청할 때마다** 이름을 푼다.
        # upstream 을 바로 쓰면 백엔드가 아직 안 떴을 때 nginx 가 시작조차 못 하고,
        # 그러면 백엔드 문제 하나로 **앱 전체가 안 뜬다**. 그걸 막는다
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $back "back:8000";
        proxy_pass http://$back;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # 백엔드가 꺼져 있으면 502 가 나간다 — 앱은 "못 보냄"으로 보고 들고 있다가 다시 보낸다
    }

    # 그림 만들기 (정답사진 · 옮긴 그림) — 백엔드가 GPU 의 FLUX 서버에 다녀온다 (server/app/flux.py).
    # 사진 두 장을 올리고(원본 크기 — 한 장에 몇 MB) 한 장에 8~9초, 줄을 서면 더 걸린다.
    # 기다리는 한도: 백엔드 85초 < 앱 95초 < 여기 100초 = Cloudflare 가 끊는 시간. 크기 한도: 백엔드는 사진 한 장 15MB
    location = /transfer {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $back "back:8000";
        proxy_pass http://$back;

        client_max_body_size 31m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 100s;
    }

    # 서버가 살아 있는지 확인용
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $back "back:8000";
        proxy_pass http://$back;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
