[project]
name = "danghwaeung"
version = "0.1.0"
description = "당화응 — 서버(FastAPI)·평가 하네스·학습 도구. 공통 언어 Python 3.11"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 평가 하네스 (eval/)
eval = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
]
# 서버 (VLM 중간 서버 #180). Stable-Makeup 워커·잡 큐는 2026-09-29 뺐다(#221) — redis·rq 는 지금 안 쓴다(정리는 ④). 옛 실험은 poc/look-tryon/server-bench
server = [
    "redis>=5.0",
    "rq>=1.16",
    # 화장 레이어 추출(#49): numpy Lab 변환 + 얼굴 랜드마크(Face Landmarker .task는 저장소 밖, DHE_FACE_LANDMARKER_PATH)
    "numpy>=1.26",
    "pillow>=10.3",
    "mediapipe>=0.10.14",
]
# VLM 선정 실험 (eval/vlm) — 학원 PC 에서 llama-server 와 함께
vlm = [
    "pillow>=10.3",
    "mediapipe>=0.10.14",
]
# 개발 도구
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["server/tests", "eval"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["poc", "node_modules", "danghaeung_poc_3x4_20"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI 는 File()/Form() 을 기본 인자로 쓰는 게 관례
extend-per-file-ignores = { "server/app/main.py" = ["B008"] }
