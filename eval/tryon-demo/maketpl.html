<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화장 템플릿 만들기</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; background:#f6f7f9; color:#1d2330; font:15px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 20px; background:#fff; border-bottom:1px solid #e3e6eb }
  header h1 { font-size:17px; margin:0 12px 0 0 }
  select, button { font:inherit; padding:6px 12px; border:1px solid #e3e6eb; border-radius:8px; background:#fff }
  #status { padding:6px 20px; font-size:13px; color:#6b7384 }
  main { max-width:1300px; margin:0 auto; padding:14px 20px 40px }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px }
  @media (max-width:1000px){ .row{ grid-template-columns:repeat(2,1fr) } }
  .card { background:#fff; border:1px solid #e3e6eb; border-radius:10px; padding:10px }
  .card h2 { font-size:13px; margin:0 0 8px; color:#6b7384 }
  .card canvas, .card img { width:100%; display:block; border-radius:6px; background:#222 }
  .note { font-size:12.5px; color:#6b7384; line-height:1.6; margin-top:12px }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:#6b7384 }
  .chip { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid #e3e6eb; border-radius:20px; padding:3px 10px }
  .chip i { width:13px; height:13px; border-radius:50%; display:inline-block }
</style>
</head>
<body>
<header>
  <h1>화장 템플릿 만들기</h1>
  <label>사람 <select id="pair"></select></label>
  <button id="apply">내 얼굴에 씌워 보기</button>
</header>
<div id="status">불러오는 중…</div>
<main>
  <div class="row">
    <div class="card"><h2>① 맨얼굴</h2><canvas id="cBare"></canvas></div>
    <div class="card"><h2>② 화장한 얼굴</h2><canvas id="cMake"></canvas></div>
    <div class="card"><h2>③ 뽑아낸 화장 층 <small>(모양+투명도)</small></h2><canvas id="cLayer"></canvas></div>
    <div class="card"><h2>④ 표준 얼굴 틀에 편 것 <small>= 템플릿</small></h2><canvas id="cUV"></canvas></div>
  </div>
  <div class="chips" id="colors"></div>
  <div class="row" style="margin-top:14px">
    <div class="card"><h2>⑤ 내 맨얼굴</h2><canvas id="cMine"></canvas></div>
    <div class="card"><h2>⑥ 템플릿 씌운 결과</h2><canvas id="cOut"></canvas></div>
  </div>
  <p class="note">
    ③은 ②에서 ①을 빼서 남은 <b>화장만</b>입니다. 조명·피부톤은 두 장에 똑같이 들어 있어 빼는 과정에서 사라집니다.
    검은 배경 위에 화장 모양이 떠 보이면 제대로 뽑힌 것입니다.<br>
    ④는 그 층을 <b>표준 얼굴 틀</b>에 편 것으로, 이 판 하나면 누구 얼굴에든 씌울 수 있습니다.
  </p>
</main>
<script type="module" src="./maketpl.js"></script>
</body>
</html>
