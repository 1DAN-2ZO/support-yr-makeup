<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화장 칠하기 방식 확인 (SNOW 방식)</title>
<style>
  :root { --ink:#1d2330; --sub:#6b7384; --line:#e3e6eb; --card:#fff; --key:#1e7bff }
  * { box-sizing:border-box }
  body { margin:0; background:#f6f7f9; color:var(--ink); font:15px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line) }
  header h1 { font-size:17px; margin:0 12px 0 0 }
  button, select { font:inherit; padding:7px 13px; border:1px solid var(--line); border-radius:8px; background:var(--card); cursor:pointer }
  button.key { background:var(--key); border-color:var(--key); color:#fff }
  #status { padding:6px 20px; font-size:13px; color:var(--sub) }
  main { max-width:1180px; margin:0 auto; padding:14px 20px 40px }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start }
  .stage { flex:1 1 520px; min-width:320px; background:#000; border-radius:12px; overflow:hidden }
  .stage canvas { width:100%; display:block }
  .stage canvas.mirror { transform:scaleX(-1) }
  video { display:none }
  .side { flex:0 0 300px }
  .ctl, .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px }
  .ctl h3 { font-size:13px; margin:0 0 6px; color:var(--sub) }
  .ctl label { display:flex; gap:8px; align-items:center; font-size:13px; margin-top:4px }
  .ctl label input[type=range] { flex:1 }
  .ctl label b { width:30px; text-align:right; font-weight:600; color:var(--sub) }
  .card h2 { font-size:13px; margin:0 0 6px; color:var(--sub) }
  pre { margin:0; font:12px/1.5 ui-monospace,Menlo,monospace; background:#f3f5f8; border-radius:8px; padding:8px; overflow:auto; max-height:260px }
  .note { font-size:12.5px; color:var(--sub); line-height:1.6 }
</style>
</head>
<body>
<header>
  <h1>화장 칠하기 방식 확인</h1>
  <label>룩 <select id="look"></select></label>
  <button id="btnPhoto">내 얼굴 사진</button>
  <button id="btnCam" class="key">카메라 켜기</button>
  <button id="btnToggle">화장 끄기</button>
  <button id="btnSeg" disabled>분할 모델 없음</button>
  <button id="btnV2" class="key">새 방식 켜기</button>
  <label style="font-size:13px;color:#6b7384">전체 진하기 <input id="master" type="range" min="0" max="150" value="100"><span id="masterVal">100%</span></label>
</header>
<div id="status">불러오는 중…</div>
<main>
  <div class="row">
    <div class="stage"><canvas id="out"></canvas></div>
    <div class="side">
      <div id="controls"></div>
      <div class="card">
        <h2>지금 룩의 숫자 (④에게 이 형식으로 요청하면 됩니다)</h2>
        <pre id="json"></pre>
        <button id="btnExtract" style="margin-top:8px;width:100%">분홍 템플릿 사진에서 색 뽑기</button>
      </div>
      <div class="card">
        <p class="note">
          화장을 <b>사진에서 떼어내지 않고</b> 색·진하기·번짐 숫자로 칠합니다.
          그래서 다른 사람의 조명이나 피부톤이 딸려오지 않습니다.
          칠하는 자리는 채점(③)이 쓰는 가이드 선과 같은 규칙입니다.
        </p>
      </div>
    </div>
  </div>
</main>
<video id="video" playsinline muted></video>
<script type="module" src="./paint.js"></script>
</body>
</html>
