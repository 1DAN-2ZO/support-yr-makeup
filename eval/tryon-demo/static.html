<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화장 매핑 품질 — 같은 사람으로 확인</title>
<style>
  * { box-sizing: border-box }
  body { margin:0; background:#f6f7f9; color:#1d2330; font:15px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 20px; background:#fff; border-bottom:1px solid #e3e6eb }
  header h1 { font-size:17px; margin:0 12px 0 0 }
  select, button { font:inherit; padding:6px 12px; border:1px solid #e3e6eb; border-radius:8px; background:#fff }
  main { max-width:1180px; margin:0 auto; padding:16px 20px 40px }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:12px }
  @media (max-width:900px){ .cols{ grid-template-columns:1fr } }
  .col { background:#fff; border:1px solid #e3e6eb; border-radius:10px; padding:10px }
  .col h2 { font-size:13px; margin:0 0 8px; color:#6b7384 }
  .col canvas, .col img { width:100%; display:block; border-radius:6px; background:#000 }
  #status { padding:6px 20px; font-size:13px; color:#6b7384 }
  .note { font-size:12.5px; color:#6b7384; margin-top:10px; line-height:1.6 }
</style>
</head>
<body>
<header>
  <h1>화장 매핑 품질 — 같은 사람으로 확인</h1>
  <label>사람 <select id="pair"></select></label>
  <a href="./" style="margin-left:auto;font-size:13px">← 실시간 확인으로</a>
</header>
<div id="status">불러오는 중…</div>
<main>
  <div class="cols">
    <div class="col"><h2>① 맨얼굴 (원본)</h2><img id="imgBare"></div>
    <div class="col"><h2>② 우리가 붙인 결과 (얼굴 점 매핑)</h2><canvas id="gl"></canvas></div>
    <div class="col"><h2>③ 실제 화장 사진 (정답)</h2><img id="imgMake"></div>
  </div>
  <p class="note">
    ②는 ③에서 화장만 떼어내 얼굴 모양 틀에 굽고, 다시 ①의 얼굴 점 위에 붙인 것입니다.
    같은 사람이라 <b>얼굴이 안 맞는 문제는 없고</b>, 순수하게 <b>떼어내기·굽기·붙이기</b>가 얼마나 정확한지만 보입니다.
    ②와 ③이 비슷하면 이 방식 자체는 쓸 만하다는 뜻이고, 차이가 크면 방식에 한계가 있다는 뜻입니다.
  </p>
</main>
<script type="module" src="./static.js"></script>
</body>
</html>
