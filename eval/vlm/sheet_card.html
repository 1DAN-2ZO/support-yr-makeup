<section data-n="{{N}}"><h2>{{N}}번 <span class=look>화장: {{LOOK}}</span></h2>
<div class=row>
  <figure class=bare><img data-photo="{{PHOTO}}" alt="{{N}}번 맨얼굴"><figcaption>맨얼굴</figcaption></figure>
  <figure class=base><canvas data-slot="{{N}}N" width=1 height=1></canvas><figcaption>개인화 없음</figcaption></figure>
  <figure><canvas data-slot="{{N}}A" width=1 height=1></canvas><figcaption>A</figcaption></figure>
  <figure><canvas data-slot="{{N}}B" width=1 height=1></canvas><figcaption>B</figcaption></figure>
</div>
<div class=pick>
  <label><input type=radio name=p{{N}} value=A>A가 낫다</label>
  <label><input type=radio name=p{{N}} value=same>비슷하다</label>
  <label><input type=radio name=p{{N}} value=B>B가 낫다</label>
</div></section>
