<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정답 매기기</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --sub: #6b7384; --line: #e3e6eb;
          --ok: #2e9d5b; --slight: #d89b1d; --off: #d0463b; --guide: #1e7bff; }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 12px 0 0 }
  select, button { font: inherit }
  .bar { flex: 1; min-width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden }
  .bar i { display: block; height: 100%; background: var(--guide); width: 0 }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px }
  .meta { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; margin-bottom: 10px }
  .meta b { font-size: 20px } .meta span { color: var(--sub) }
  .views { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px }
  @media (max-width: 860px) { .views { grid-template-columns: 1fr } }
  .view { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px }
  .view p { margin: 0 0 6px; font-size: 13px; color: var(--sub) }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: #000 }
  .answer { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 8px }
  .answer button { flex: 1; min-width: 150px; padding: 16px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); font-size: 17px; cursor: pointer }
  .answer button small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px }
  .answer button[data-v="ok"].on { border-color: var(--ok); background: #eaf7ef }
  .answer button[data-v="slight"].on { border-color: var(--slight); background: #fdf5e4 }
  .answer button[data-v="off"].on { border-color: var(--off); background: #fcebea }
  .answer button[data-v="invalid"] { color: var(--sub) }
  .answer button[data-v="invalid"].on { border-color: var(--sub); background: #eceef2 }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--sub); font-size: 13px }
  .nav button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer }
  .help { margin-top: 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; color: var(--sub) }
  .help b { color: var(--ink) }
  .done { padding: 40px; text-align: center; font-size: 18px }
  label.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--sub) }
</style>
</head>
<body>
<header>
  <h1>정답 매기기</h1>
  <label>라벨러
    <select id="rater"><option value="">선택…</option><option value="a">a</option><option value="b">b</option></select>
  </label>
  <label>부위
    <select id="part"><option value="">전체</option><option value="brow">눈썹</option><option value="liner">아이라인</option>
      <option value="lip">입술</option><option value="shadow">섀도우</option><option value="cheek">볼터치</option></select>
  </label>
  <label class="chk"><input type="checkbox" id="todo" checked> 안 매긴 것만</label>
  <label class="chk"><input type="checkbox" id="guide" checked> 가이드 선 보기</label>
  <div class="bar"><i id="prog"></i></div>
  <span id="count">0 / 0</span>
</header>
<main id="app"><div class="done">위에서 라벨러(a 또는 b)를 먼저 골라 주세요.</div></main>

<script>
// MediaPipe 478점 번호 — client/src/core/landmarks.ts 와 같다. A = 이미지 왼쪽(피험자 오른쪽)
const LM = {
  eyeA: { outer: 33, inner: 133, upper: [33, 246, 161, 160, 159, 158, 157, 173, 133] },
  eyeB: { outer: 263, inner: 362, upper: [263, 466, 388, 387, 386, 385, 384, 398, 362] },
  browA: { upper: [70, 63, 105, 66, 107], lower: [46, 53, 52, 65, 55] },
  browB: { upper: [300, 293, 334, 296, 336], lower: [276, 283, 282, 295, 285] },
  lipsOuter: [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146],
  cheekA: 50, cheekB: 280, faceL: 234, faceR: 454,
};
// 채점기 임시 가이드(eval/score/guide-poc.mjs)와 같은 치수 — 보여 주기용
const T = { wingAngle: 30, wing: 0.15, shadow: 0.55, cheek: { rx: 0.11, ry: 0.07, tilt: -25 } };
const PART_KO = { brow: "눈썹", liner: "아이라인", lip: "입술", shadow: "섀도우", cheek: "볼터치" };
const HINT = {
  brow: "파란 선 = 눈썹 모양 기준. 눈썹이 이 모양을 따라 좌우 비슷하게 그려졌나",
  liner: "파란 선 = 눈 윗선 + 꼬리 방향(30°). 라인이 윗선을 따라가고 꼬리가 이 방향으로 빠졌나",
  lip: "파란 선 = 입술 윤곽. 색이 윤곽 안에 채워졌나, 밖으로 번졌나",
  shadow: "파란 영역 = 섀도우 범위(눈두덩 55%). 색이 이 안에 있나",
  cheek: "파란 타원 = 볼터치 위치. 색이 이 안에 있나",
};

const $ = (s) => document.querySelector(s);
let all = [], mine = {}, list = [], idx = 0, rater = "";
const lmCache = new Map(), imgCache = new Map();

const P = (lm, i) => ({ x: lm[i][0], y: lm[i][1] });
const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mix = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

function ellipse(c, rx, ry, deg, n = 40) {
  const t = (deg * Math.PI) / 180, out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI, x = rx * Math.cos(a), y = ry * Math.sin(a);
    out.push({ x: c.x + x * Math.cos(t) - y * Math.sin(t), y: c.y + x * Math.sin(t) + y * Math.cos(t) });
  }
  return out;
}

/** 부위별 가이드 모양: [{ pts, closed }] */
function guides(part, lm) {
  const sides = [
    { eye: LM.eyeA, brow: LM.browA, cheek: LM.cheekA, face: LM.faceL, sign: -1 },
    { eye: LM.eyeB, brow: LM.browB, cheek: LM.cheekB, face: LM.faceR, sign: 1 },
  ];
  const ueye = (d(P(lm, 33), P(lm, 133)) + d(P(lm, 263), P(lm, 362))) / 2;
  const faceW = d(P(lm, LM.faceL), P(lm, LM.faceR));
  const out = [];
  for (const s of sides) {
    if (part === "brow") out.push({ pts: [...s.brow.upper, ...[...s.brow.lower].reverse()].map((i) => P(lm, i)), closed: true });
    if (part === "liner") {
      const o = P(lm, s.eye.outer), inn = P(lm, s.eye.inner);
      const v = { x: o.x - inn.x, y: o.y - inn.y }, l = Math.hypot(v.x, v.y) || 1, a = (T.wingAngle * Math.PI) / 180;
      let dir = { x: (v.x / l) * Math.cos(a), y: (v.y / l) * Math.cos(a) - Math.sin(a) };
      const dl = Math.hypot(dir.x, dir.y) || 1;
      dir = { x: dir.x / dl, y: dir.y / dl };
      out.push({ pts: s.eye.upper.map((i) => P(lm, i)), closed: false });
      out.push({ pts: [o, { x: o.x + dir.x * T.wing * ueye, y: o.y + dir.y * T.wing * ueye }], closed: false });
    }
    if (part === "shadow") {
      const lid = s.eye.upper.map((i) => P(lm, i)), lo = s.brow.lower.map((i) => P(lm, i));
      const top = lid.map((p, i) => mix(p, lo[Math.min(lo.length - 1, Math.round((i / (lid.length - 1)) * (lo.length - 1)))], T.shadow));
      out.push({ pts: [...lid, ...top.reverse()], closed: true });
    }
    if (part === "cheek") out.push({ pts: ellipse(mix(P(lm, s.cheek), P(lm, s.face), 0.25), faceW * T.cheek.rx, faceW * T.cheek.ry, s.sign * T.cheek.tilt), closed: true });
  }
  if (part === "lip") out.push({ pts: LM.lipsOuter.map((i) => P(lm, i)), closed: true });
  return out;
}

/** 확대할 범위: 부위 점들 + 여백 */
function focusBox(part, lm, w, h) {
  const g = guides(part, lm).flatMap((s) => s.pts);
  const xs = g.map((p) => p.x), ys = g.map((p) => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const m = Math.max(x1 - x0, y1 - y0) * 0.35;
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w, x1 + m); y1 = Math.min(h, y1 + m);
  return { x0, y0, x1, y1 };
}

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); }
function img(src) {
  if (!imgCache.has(src)) imgCache.set(src, new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = "/data/" + src; }));
  return imgCache.get(src);
}
function lmOf(src) { if (!lmCache.has(src)) lmCache.set(src, getJSON("/data/" + src)); return lmCache.get(src); }

function draw(canvas, im, lm, part, box, showGuide) {
  const W = box ? box.x1 - box.x0 : im.width, H = box ? box.y1 - box.y0 : im.height;
  const scale = Math.min(900 / W, 900 / H, box ? 6 : 1.5);
  canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
  const c = canvas.getContext("2d");
  c.imageSmoothingQuality = "high";
  c.drawImage(im, box ? box.x0 : 0, box ? box.y0 : 0, W, H, 0, 0, canvas.width, canvas.height);
  if (!showGuide || !lm) return;
  c.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--guide");
  c.lineWidth = Math.max(2, canvas.width / 180);  // 화면에 줄여 보여도 보이게
  c.setLineDash([c.lineWidth * 3, c.lineWidth * 2]);
  for (const s of guides(part, lm)) {
    c.beginPath();
    s.pts.forEach((p, i) => { const x = (p.x - (box ? box.x0 : 0)) * scale, y = (p.y - (box ? box.y0 : 0)) * scale; i ? c.lineTo(x, y) : c.moveTo(x, y); });
    if (s.closed) c.closePath();
    c.stroke();
  }
}

function refilter() {
  const part = $("#part").value, todo = $("#todo").checked;
  list = all.filter((it) => (!part || it.part === part) && (!todo || !mine[it.id]));
  idx = Math.min(idx, Math.max(0, list.length - 1));
}
function progress() {
  const n = all.filter((it) => mine[it.id]).length;  // 지금 보이는 시험지 중 매긴 것만
  $("#count").textContent = `${n} / ${all.length} 매김`;
  $("#prog").style.width = `${all.length ? (n / all.length) * 100 : 0}%`;
}

async function show() {
  progress();
  const app = $("#app");
  if (!rater) { app.innerHTML = '<div class="done">위에서 라벨러(a 또는 b)를 먼저 골라 주세요.</div>'; return; }
  if (!list.length) { app.innerHTML = '<div class="done">이 조건에서 매길 사진이 없어요. 수고하셨어요! 🎉</div>'; return; }
  const it = list[idx];
  app.innerHTML = `
    <div class="meta"><b>${PART_KO[it.part]}</b><span>${it.id}</span><span>${idx + 1} / ${list.length}</span></div>
    <div class="views">
      <div class="view"><p>화장 사진 · ${PART_KO[it.part]} 확대</p><canvas id="zoom"></canvas></div>
      <div class="view"><p>화장 사진 · 전체</p><canvas id="full"></canvas></div>
      <div class="view"><p>맨얼굴 · 같은 부분 (비교용)</p><canvas id="bare"></canvas></div>
    </div>
    <div class="answer">
      <button data-v="ok">1 · 맞음<small>가이드 안에 잘 그림</small></button>
      <button data-v="slight">2 · 조금 벗어남<small>일부가 밖으로 나가거나 모양이 조금 다름</small></button>
      <button data-v="off">3 · 많이 벗어남<small>크게 벗어나거나 모양이 많이 다름</small></button>
      <button data-v="invalid">4 · 판단 불가<small>사진 오류 — 가이드가 엉뚱한 곳, 얼굴이 가려짐 등</small></button>
    </div>
    <div class="nav">
      <button id="prev">← 이전</button><button id="next">다음 →</button><button id="clear">이 사진 답 지우기</button>
      <span>키보드: 1 · 2 · 3 · 4 로 고르기, ← → 로 이동. 누르면 바로 저장되고 다음 사진으로 넘어가요.</span>
    </div>
    <div class="help"><b>보는 기준</b> — ${HINT[it.part]}<br>
      채점기 답과 다른 사람 답은 일부러 안 보여 줘요. 내 눈으로 본 대로 골라 주세요. 애매하면 "조금 벗어남".</div>`;
  app.querySelectorAll(".answer button").forEach((b) => { b.classList.toggle("on", mine[it.id] === b.dataset.v); b.onclick = () => answer(b.dataset.v); });
  $("#prev").onclick = () => move(-1); $("#next").onclick = () => move(1); $("#clear").onclick = () => answer(null);
  const [mim, mlm, bim, blm] = await Promise.all([img(it.makeup), lmOf(it.makeup_lm), img(it.bare), lmOf(it.bare_lm)]);
  const g = $("#guide").checked;
  draw($("#zoom"), mim, mlm, it.part, focusBox(it.part, mlm, mim.width, mim.height), g);
  draw($("#full"), mim, mlm, it.part, null, g);
  draw($("#bare"), bim, blm, it.part, focusBox(it.part, blm, bim.width, bim.height), g);
  // 다음 사진 미리 받기
  const nx = list[idx + 1]; if (nx) { img(nx.makeup); img(nx.bare); lmOf(nx.makeup_lm); lmOf(nx.bare_lm); }
}

async function answer(v) {
  const it = list[idx];
  const r = await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rater, id: it.id, label: v }) });
  if (!r.ok) { alert("저장 실패 — 화면을 새로고침해 주세요"); return; }
  if (v) mine[it.id] = v; else delete mine[it.id];
  if (v && $("#todo").checked) { refilter(); } else if (v) { idx = Math.min(idx + 1, list.length - 1); }
  show();
}
function move(k) { idx = Math.max(0, Math.min(list.length - 1, idx + k)); show(); }

document.addEventListener("keydown", (e) => {
  if (!rater || !list.length || e.target.tagName === "SELECT") return;
  if (e.key === "1") answer("ok"); else if (e.key === "2") answer("slight"); else if (e.key === "3") answer("off");
  else if (e.key === "4") answer("invalid");
  else if (e.key === "ArrowRight") move(1); else if (e.key === "ArrowLeft") move(-1);
});
$("#rater").onchange = async (e) => { rater = e.target.value; mine = rater ? await getJSON(`/api/labels?rater=${rater}`) : {}; idx = 0; refilter(); show(); };
$("#part").onchange = () => { idx = 0; refilter(); show(); };
$("#todo").onchange = () => { idx = 0; refilter(); show(); };
$("#guide").onchange = () => show();

(async () => { all = await getJSON("/api/items"); refilter(); show(); })();
</script>
</body>
</html>
