<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      [개발 전용] 실시간 가이드 화면만 혼자 띄워 **숫자로 재는** 임시 페이지.
      촬영(capture-probe)·시도사진(attempt-probe)과 **같은 방식**이라 세 화면의 숫자를 견줄 수 있다.
      `npm run build` 에는 안 들어간다 (vite 는 index.html 하나만 묶는다).
      띄우기: npm run dev -- --port 5177   →   http://localhost:5177/live-probe.html?norotate
      (5174 는 이 레포, 5175 는 촬영, 5176 은 시도사진 임시 페이지가 쓰고 있다)
      `?norotate` 를 붙이는 까닭: PC 창은 부위별 화면 방향 조건에 걸린다 (core/orientation-lock).
    -->
    <title>nudy — 실시간 가이드 화면 확인</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/live-probe.tsx"></script>
  </body>
</html>
