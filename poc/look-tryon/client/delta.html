<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>당화응 POC — 진짜 경로(ΔLab 레이어) 실시간 매핑</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>얼굴 촬영 → 룩 생성(서버) → ΔLab 레이어 실시간 매핑</h1>
  <p class="note">
    app.js(v2)는 생성 사진 전체를 오려 붙입니다(스티커 같음). 이 데모는 <b>server/app/layer.py와 동일한
    ΔLab 델타</b>만 뽑아서, 라이브 프레임 자기 피부톤 위에 그 변화량을 더합니다 — 정식 설계가 실제로
    이렇게 동작하도록 돼 있는 경로의 품질 확인용입니다.
  </p>
  <div id="status" class="status">초기화 중…</div>

  <video id="video" playsinline muted class="camPreview"></video>

  <section id="step1">
    <h2>1. 얼굴 촬영</h2>
    <button id="btnCapture" disabled>얼굴 촬영</button>
    <img id="sourcePreview" class="thumb" />
  </section>

  <section id="step2" hidden>
    <h2>2. 룩 참조 사진</h2>
    <input type="file" id="refFile" accept="image/*" />
    <img id="refPreview" class="thumb" />
    <button id="btnGenerate" disabled>이 룩으로 생성 (서버, 약 3초)</button>
  </section>

  <section id="step3" hidden>
    <h2>3. 완성 예상 + 추출된 ΔLab 레이어(디버그)</h2>
    <img id="resultPreview" class="thumb" />
    <img id="layerPreview" class="thumb" title="검정 배경 위에 합성한 레이어(알파 그대로) — 부위별 색이 실제로 뽑혔는지 확인용" />
    <button id="btnLive">실시간으로 보기</button>
  </section>

  <section id="liveStage" hidden>
    <h2>실시간 매핑 <span id="liveStatus"></span></h2>
    <canvas id="liveCanvas"></canvas>
    <label>합성 강도 <input type="range" id="alpha" min="0" max="2" step="0.05" value="1" /></label>
    <label>추적 반응성(EMA alpha) — guide 브랜치와 같은 단순 이동평균. 높을수록 빠르게 따라오고, 낮을수록 부드럽지만 처짐
      <input type="range" id="alpha_smooth" min="0.1" max="1" step="0.05" value="0.5" />
      <span id="alphaSmoothVal"></span>
    </label>
  </section>

  <button id="btnReset">초기화</button>

  <script type="module" src="app-delta.js"></script>
</body>
</html>
