services:
  back:
    build:
      context: .
      dockerfile: BackDockerfile

    container_name: back-server

    ports:
      - "8000:8000"

    volumes:
      - ./server:/app/server
      # 사용 기록(/events) 저장 — 저장소 밖, 서버 PC 의 D:/nudy-data 에 쌓인다 (eval/funnel 이 읽음)
      - D:/nudy-data:/data

    environment:
      # 로그 시각을 한국 시간으로 (없으면 UTC 라 9시간 늦게 찍힌다). 지역 이름(Asia/Seoul) 대신 POSIX 꼴로 적는다 —
      # 이미지에 시간대 자료(tzdata)가 없어도 통한다. 사용 기록 · 보관 사진의 날짜 폴더 이름은 코드가 UTC 로 고정해 두어 그대로다
      - TZ=KST-9
      # 배포 프론트(https)에서 이 API를 부를 수 있게 허용 (CORS). 개발용 localhost 도 유지
      - DHE_CORS_ORIGINS=https://nudy.shelldocs.cloud,http://localhost:5173,http://127.0.0.1:5173,https://localhost:5173,https://127.0.0.1:5173
      # 사용 기록 저장 폴더 — 없으면 /events 가 503 (server/app/events.py)
      - DHE_DATA_DIR=/data
      # 그림 만들기(/transfer)가 부르는 GPU PC 의 FLUX 서버 (Tailscale 주소) — 없으면 /transfer 가 503 off (server/app/flux.py)
      - DHE_FLUX_URL=http://100.110.57.95:7861
      # 테스트 기간 사진 보관 (2026-10-09 켬) — 참고 사진을 뺀 사진 · 피드백 결과를 /data/keep 에 둔다 (server/app/keep.py).
      # 2026-10-12: 받은 날부터 7일이 아니라 10월 19일 오후 5시(한국 시간)까지 두었다가 그때 한꺼번에 지운다. 그 뒤로는 받지도 않는다.
      # 동의 화면 문구(client/src/screens/consent.ts 의 테스트 기간 문단)와 짝이다 — 테스트가 끝나면(2026-10-19 오후 3시) 이 줄과 그 문단을 같이 뺀다
      - DHE_KEEP_UNTIL=2026-10-19T17:00:00+09:00

    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: FrontDockerfile

    container_name: front-server

    ports:
      - "80:80"

    restart: unless-stopped
