services:
  back:
    build:
      context: .
      dockerfile: BackDockerfile

    container_name: back-server

    ports:
      - "8000:8000"

    volumes:
      - ./server:/app/server
      # 사용 기록(/events) 저장 — 저장소 밖, 서버 PC 의 D:/nudy-data 에 쌓인다 (eval/funnel 이 읽음)
      - D:/nudy-data:/data

    environment:
      # 배포 프론트(https)에서 이 API를 부를 수 있게 허용 (CORS). 개발용 localhost 도 유지
      - DHE_CORS_ORIGINS=https://nudy.shelldocs.cloud,http://localhost:5173,http://127.0.0.1:5173,https://localhost:5173,https://127.0.0.1:5173
      # 사용 기록 저장 폴더 — 없으면 /events 가 503 (server/app/events.py)
      - DHE_DATA_DIR=/data
      # 그림 만들기(/transfer)가 부르는 GPU PC 의 FLUX 서버 (Tailscale 주소) — 없으면 /transfer 가 503 off (server/app/flux.py)
      - DHE_FLUX_URL=http://100.110.57.95:7861
      # 테스트 기간 사진 보관 (2026-10-09 켬) — 참고 사진을 뺀 사진 · 피드백 결과를 /data/keep 에 받은 날 기준 7일 (server/app/keep.py).
      # 동의 화면 문구(client/src/screens/consent.ts 의 테스트 기간 문단)와 짝이다 — 테스트가 끝나면 이 줄과 그 문단을 같이 뺀다
      - DHE_KEEP_DAYS=7

    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: FrontDockerfile

    container_name: front-server

    ports:
      - "80:80"

    restart: unless-stopped
