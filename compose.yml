services:
  back:
    build:
      context: .
      dockerfile: BackDockerfile

    container_name: back-server

    ports:
      - "8000:8000"

    volumes:
      - ./server:/app/server

    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: FrontDockerfile

    container_name: front-server

    ports:
      - "80:80"

    restart: unless-stopped
