name: Deploy FLUX (GPU)

# FLUX 화장 입히기 서버 자동 배포.
# main 의 app_klein.py 가 바뀌면 GPU 서버(nudy-gpu 러너)에서 FLUX 를 재시작한다.
on:
  push:
    branches:
      - main
    paths:
      - "poc/look-tryon/server-bench/app_klein.py"
  workflow_dispatch:

jobs:
  deploy-flux:
    runs-on: [self-hosted, gpu]   # GPU 서버 러너에서만 (nudy-gpu)

    defaults:
      run:
        # GPU PC 는 스크립트 실행이 막혀 있어(ExecutionPolicy) 단계마다 우회
        shell: powershell -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy app_klein.py to run location
        run: |
          Copy-Item "poc/look-tryon/server-bench/app_klein.py" "D:\app_klein.py" -Force
          Write-Host "app_klein.py 복사 완료"

      - name: Stop FLUX (free port 7861)
        run: |
          # 7861 포트를 쓰는 FLUX 만 끈다 — 같은 PC 의 다른 파이썬 실험은 건드리지 않음.
          # 127.0.0.1 로 좁히는 이유: 100.110.57.95:7861 은 portproxy(svchost)가 잡고 있어 같이 끄면 바깥 길이 끊긴다
          $p = (Get-NetTCPConnection -LocalPort 7861 -LocalAddress 127.0.0.1 -State Listen -ErrorAction SilentlyContinue).OwningProcess | Select-Object -Unique
          if ($p) { Stop-Process -Id $p -Force; Write-Host "기존 FLUX 종료 (PID $p)" } else { Write-Host "7861 에 떠 있는 것 없음" }
          Start-Sleep 3

      - name: Start FLUX (via NudyFluxSys task)
        run: |
          # NudyFluxSys: SYSTEM 권한 · 부팅 시 자동 실행 작업. 로그인 세션 없이도 뜬다 (D:\run-flux.bat → D:\flux.log)
          schtasks /Run /TN NudyFluxSys
          Write-Host "FLUX 재시작 요청 — 모델 로드까지 약 50~100초"

      - name: Wait for FLUX ready
        run: |
          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep 10
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:7861" -TimeoutSec 8 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Write-Host "대기 중... ($($i*10)s)"
          }
          if (-not $ok) { throw "FLUX 가 5분 안에 안 떴습니다 — D:\flux.log 확인" }
          Write-Host "FLUX 기동 확인 (127.0.0.1:7861 → 200)"
