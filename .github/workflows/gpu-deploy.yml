name: Deploy FLUX (GPU)

# FLUX 화장 입히기 서버 자동 배포.
# main 의 app_klein.py 가 바뀌면 GPU 서버(nudy-gpu 러너)에서 FLUX 를 재시작한다.
on:
  push:
    branches:
      - main
    paths:
      - "poc/look-tryon/server-bench/app_klein.py"
  workflow_dispatch:

jobs:
  deploy-flux:
    runs-on: [self-hosted, gpu]   # GPU 서버 러너에서만 (nudy-gpu)

    defaults:
      run:
        # GPU PC 는 스크립트 실행이 막혀 있어(ExecutionPolicy) 단계마다 우회
        shell: powershell -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 아래 run 의 스크립트에는 한글을 쓰지 않는다 — GPU PC 의 PowerShell 5.1 이 스크립트 파일(BOM 없는 UTF-8)을
      # 시스템 글자 코드로 읽어서, 한글이 깨지며 따옴표가 안 닫힌 것으로 읽힌다. 그러면 그 단계의 스크립트가 통째로 실행되지 않는다
      # (2026-10-08: "Start FLUX" 가 이 오류로 죽어 FLUX 가 꺼진 채 남았다). 설명은 이렇게 스크립트 밖 주석으로 적는다.
      - name: Copy app_klein.py to run location
        run: |
          Copy-Item "poc/look-tryon/server-bench/app_klein.py" "D:\app_klein.py" -Force
          Write-Host "app_klein.py copied"

      # 7861 포트를 쓰는 FLUX 만 끈다 — 같은 PC 의 다른 파이썬 실험은 건드리지 않음.
      # 127.0.0.1 로 좁히는 이유: 100.110.57.95:7861 은 portproxy(svchost)가 잡고 있어 같이 끄면 바깥 길이 끊긴다
      - name: Stop FLUX (free port 7861)
        run: |
          $p = (Get-NetTCPConnection -LocalPort 7861 -LocalAddress 127.0.0.1 -State Listen -ErrorAction SilentlyContinue).OwningProcess | Select-Object -Unique
          if ($p) { Stop-Process -Id $p -Force; Write-Host "stopped FLUX (PID $p)" } else { Write-Host "nothing listening on 7861" }
          Start-Sleep 3

      # NudyFluxSys: SYSTEM 권한 · 부팅 시 자동 실행 작업. 로그인 세션 없이도 뜬다 (D:/run-flux.bat → D:/flux.log)
      # 모델을 올리는 데 50~100초쯤 걸린다
      - name: Start FLUX (via NudyFluxSys task)
        run: |
          schtasks /Run /TN NudyFluxSys
          if ($LASTEXITCODE -ne 0) { throw "schtasks failed ($LASTEXITCODE)" }
          Write-Host "FLUX restart requested"

      # 5분 안에 127.0.0.1:7861 이 200 으로 답하면 성공. 안 뜨면 GPU PC 의 D:/flux.log 를 본다
      - name: Wait for FLUX ready
        run: |
          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep 10
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:7861" -TimeoutSec 8 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Write-Host "waiting... ($($i*10)s)"
          }
          if (-not $ok) { throw "FLUX did not come up in 5 minutes - check D:/flux.log" }
          Write-Host "FLUX is up (127.0.0.1:7861 -> 200)"
