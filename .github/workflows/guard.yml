name: guard

# 강제 푸시를 사후에 잡는다. 막지는 못하지만 즉시 드러나고 복구용 SHA 를 남긴다.
# 훅(.githooks/pre-push)을 안 깔았거나 --no-verify 로 우회한 경우의 안전망.
on:
  push:
    branches: [main, capture, guide, score, server, model, app, 'poc/**']
  delete:

jobs:
  force-push:
    if: github.event_name == 'push' && github.event.forced
    runs-on: ubuntu-latest
    steps:
      - name: 사라진 커밋 기록
        run: |
          echo "## 강제 푸시 감지" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 항목 | 값 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 브랜치 | \`${GITHUB_REF#refs/heads/}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 누가 | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 덮기 전 (before) | \`${{ github.event.before }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 덮은 뒤 (after) | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**\`before\` 에만 있던 커밋은 브랜치에서 사라졌습니다.** 아직 GitHub 에 남아 있으니 되살릴 수 있습니다:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "gh api repos/${{ github.repository }}/git/refs -X POST \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  -f ref=refs/heads/rescue/\$(date +%m%d) -f sha=${{ github.event.before }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "규칙: \`docs/work-split-modules-v6.md\` §0-1" >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=강제 푸시::${GITHUB_REF#refs/heads/} 에 강제 푸시. before=${{ github.event.before }} 의 커밋이 사라졌습니다. 복구 방법은 이 실행의 Summary 참고"
          exit 1

  protected-delete:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: 보호 브랜치 삭제 감지
        run: |
          case "${{ github.event.ref }}" in
            main|capture|guide|score|server|model|app|poc/full)
              echo "::error title=보호 브랜치 삭제::${{ github.event.ref }} 가 ${{ github.actor }} 에 의해 삭제됐습니다"
              exit 1 ;;
            *) echo "일반 브랜치 삭제: ${{ github.event.ref }}" ;;
          esac
