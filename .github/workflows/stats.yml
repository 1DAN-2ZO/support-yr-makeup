name: 사용 기록 보기

# 백엔드 PC 에 쌓인 사용 기록(D:/nudy-data/events — 컨테이너 안 /data/events)을 모아 이 실행 화면의 Summary 에 표로 보여 준다:
# 작업마다 몇 초 걸렸나 · 화면마다 얼마나 머물렀나 · 어디까지 갔나 (eval/funnel/show.py).
# 사용 기록은 2026-10-19 오후 5시에 모두 지운다 (동의 화면에 그렇게 적었다) — 그 뒤에는 볼 것이 없다.
# 손으로만 돌린다 (Actions → "사용 기록 보기" → Run workflow). 서버 · 기록은 건드리지 않고 읽기만 한다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "볼 기간 — 최근 며칠치 파일 (all = 전부)"
        type: choice          # 고르는 값만 받는다 — 아래에서 명령 줄에 그대로 들어간다
        options: ["all", "1", "3", "7"]
        default: "all"

jobs:
  show:
    runs-on: [self-hosted, frontback]   # 기록이 있는 프론트백 서버 (NUDY-SERVER1)

    defaults:
      run:
        # cmd — 한글이 든 결과 파일을 바이트 그대로 붙이려고 (PowerShell 은 글자 코드를 바꿔 깨뜨린다)
        shell: cmd

    env:
      DAYS: ${{ inputs.days }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 집계 (백엔드 컨테이너 안에서 — 파이썬과 기록 폴더가 거기 있다)
        run: |
          set FLAG=
          if not "%DAYS%"=="all" set FLAG=--days %DAYS%
          docker exec back-server rm -rf /tmp/nudy-funnel
          docker cp eval\funnel back-server:/tmp/nudy-funnel || exit /b 1
          docker exec back-server python /tmp/nudy-funnel/show.py /data/events %FLAG% --out /tmp/nudy-funnel/summary.md || exit /b 1
          docker cp back-server:/tmp/nudy-funnel/summary.md summary.md || exit /b 1
          docker exec back-server rm -rf /tmp/nudy-funnel

      - name: 결과 보여 주기
        run: |
          type summary.md >> "%GITHUB_STEP_SUMMARY%"
          type summary.md
