name: Deploy frontend+backend (Docker)

# 화면·백엔드 도커 배포. main 에 올라오면 프론트백 서버에서 재배포한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, frontback]   # 프론트백 서버 러너 (NUDY-SERVER1) — GPU 러너와 라벨로 구분

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Docker Down
        working-directory: .
        run: docker compose down
        continue-on-error: true

      - name: Docker Build
        working-directory: .
        run: |
          docker builder prune -af
          docker compose build --no-cache

      - name: Docker Up
        working-directory: .
        run: docker compose --profile tools up -d
