name: Deploy (self-hosted)

# 배포는 수동 실행으로 시작한다 (Actions 탭 → Run workflow, 또는 gh workflow run deploy.yml).
# main 에 합쳐지자마자 자동 배포하려면 아래 push 블록의 주석을 풀면 된다.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Docker Down
        working-directory: .
        run: docker compose down
        continue-on-error: true

      - name: Docker Build
        working-directory: .
        run: |
          docker builder prune -af
          docker compose build --no-cache

      - name: Docker Up
        working-directory: .
        run: docker compose --profile tools up -d
