name: Print Workflow

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  print-workflow:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop Docker Compose
        run: docker compose down || true

      - name: Start Docker Compose
        run: docker compose up -d
